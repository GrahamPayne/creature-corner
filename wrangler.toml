# Cloudflare Pages configuration.
#
# This repo has no build step (static files served as-is — see CLAUDE.md
# and README.md); this file exists ONLY to configure the Pages Functions
# layer (functions/api/) that was added for the Orders & Fulfillment
# infrastructure (see docs/ORDERS_FULFILLMENT_ARCHITECTURE.md).
#
# `name` is a required top-level field for Wrangler's config validation —
# its absence is what made Cloudflare reject this file outright during
# Pages configuration validation, before ever attempting to build
# anything ("Missing top-level field 'name' in configuration file").
# Must match the Cloudflare Pages project's actual name.
name = "creature-corner"

# nodejs_compat is required for @supabase/supabase-js to run in the
# Workers runtime Pages Functions use — it relies on Node built-ins
# (crypto, process, etc.) that aren't present by default. Without this
# flag, functions/api/orders/create.js's Supabase import fails at build
# or request time. pages_build_output_dir tells Cloudflare this config
# belongs to a Pages project (not a plain Worker) and that the static
# output is the repo root, matching the no-build-step deploy model.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Without this block, the dashboard's "Observability" toggle alone does not
# reliably enable Functions invocation logs for a Pages project — it must
# also be declared here and picked up by a new deploy. head_sampling_rate=1
# captures every invocation (fine at this traffic volume), not a sample.
[observability]
enabled = true
head_sampling_rate = 1
